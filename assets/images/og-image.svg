<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Inter','Segoe UI',system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#14142b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1050" cy="90" r="340" fill="url(#glow1)"/>
  <circle cx="150" cy="560" r="320" fill="url(#glow2)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="472" x2="1200" y2="472"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(100,118)">
    <rect width="124" height="124" rx="28" fill="url(#accent)"/>
    <text x="62" y="62" dy="0.34em" text-anchor="middle" font-weight="800" font-size="44" letter-spacing="-2" fill="#ffffff">RRR</text>
  </g>

  <!-- Name + title -->
  <text x="262" y="150" font-weight="800" font-size="50" fill="#ffffff">Raghuramreddy Thummalapalli</text>
  <text x="262" y="206" font-weight="600" font-size="31" fill="url(#accent)">Intelligent Infrastructure Ecosystems Architect</text>

  <!-- Divider -->
  <rect x="100" y="320" width="1000" height="2" rx="1" fill="url(#accent)" opacity="0.4"/>

  <!-- Pillars -->
  <g transform="translate(100,372)" font-size="22" fill="#c7c7d1" font-weight="500">
    <g>
      <circle cx="8" cy="-7" r="5" fill="#3b82f6"/>
      <text x="26" y="0">Operational Intelligence</text>
    </g>
    <g transform="translate(360,0)">
      <circle cx="8" cy="-7" r="5" fill="#8b5cf6"/>
      <text x="26" y="0">Lifecycle Governance</text>
    </g>
    <g transform="translate(680,0)">
      <circle cx="8" cy="-7" r="5" fill="#14b8a6"/>
      <text x="26" y="0">Infrastructure Cognition</text>
    </g>
  </g>

  <!-- Tags -->
  <g transform="translate(100,438)" font-size="17" font-weight="500">
    <g><rect width="172" height="44" rx="22" fill="#ffffff" fill-opacity="0.04" stroke="#3b82f6" stroke-opacity="0.5"/><text x="86" y="28" text-anchor="middle" fill="#9db8f5">Platform Engineering</text></g>
    <g transform="translate(192,0)"><rect width="142" height="44" rx="22" fill="#ffffff" fill-opacity="0.04" stroke="#8b5cf6" stroke-opacity="0.5"/><text x="71" y="28" text-anchor="middle" fill="#c4b1f5">DevSecOps</text></g>
    <g transform="translate(354,0)"><rect width="200" height="44" rx="22" fill="#ffffff" fill-opacity="0.04" stroke="#14b8a6" stroke-opacity="0.5"/><text x="100" y="28" text-anchor="middle" fill="#7fe3d5">Human-Governed AI</text></g>
    <g transform="translate(574,0)"><rect width="180" height="44" rx="22" fill="#ffffff" fill-opacity="0.04" stroke="#3b82f6" stroke-opacity="0.5"/><text x="90" y="28" text-anchor="middle" fill="#9db8f5">Supply Chain Security</text></g>
  </g>

  <!-- Tagline + URL -->
  <text x="100" y="560" font-size="19" fill="#7a7a8c">Designing technology for human experience</text>
  <text x="1100" y="560" text-anchor="end" font-size="19" font-weight="600" fill="#9db8f5">raghuramreddy.tech</text>
</svg>
