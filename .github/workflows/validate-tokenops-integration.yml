name: Validate TokenOps Portfolio Integration

on:
  pull_request:
    paths:
      - "pages/tokenops.html"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/validate-tokenops-integration.yml"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate embedded TokenOps integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio source
        uses: actions/checkout@v6

      - name: Checkout TokenOps module source
        uses: actions/checkout@v6
        with:
          repository: Raghuramreddy-t/tokenops-cost-engineering-lab
          ref: main
          path: .integration/tokenops-source

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .integration/tokenops-source/package-lock.json

      - name: Install TokenOps dependencies
        working-directory: .integration/tokenops-source
        run: npm ci

      - name: Validate and build TokenOps module
        working-directory: .integration/tokenops-source
        run: |
          npm run validate
          npm test

      - name: Copy generated bundle into portfolio workspace
        run: |
          rm -rf assets/external/tokenops
          mkdir -p assets/external/tokenops
          cp -R .integration/tokenops-source/dist/portfolio-embed/. assets/external/tokenops/

      - name: Validate portfolio mount contract
        run: |
          test -f assets/external/tokenops/tokenops-lab.js
          test -f assets/external/tokenops/tokenops-lab.css
          test -f assets/external/tokenops/data/tokenops-api-models.json
          test -f assets/external/tokenops/data/tokenops-copilot-models.json
          test -f assets/external/tokenops/data/tokenops-copilot-plans.json
          grep -q 'id="tokenops-lab-root"' pages/tokenops.html
          grep -q 'assets/external/tokenops/tokenops-lab.css' pages/tokenops.html
          grep -q 'assets/external/tokenops/tokenops-lab.js' pages/tokenops.html
          grep -q 'Designing technology for human experience' pages/tokenops.html
          ! grep -q 'token-pricing.js' pages/tokenops.html
          ! grep -q 'raw.githubusercontent.com' pages/tokenops.html
          ! grep -qi '<iframe' pages/tokenops.html